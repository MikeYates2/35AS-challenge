<style>
/* Layout: one screen. Header line, a stacked deck of cards in the middle, one wide rectangular button underneath. */
:root {
  --bg: #EDF0F5;
  --ink: #14203B;
  --muted: #5B6781;
  --paper: #FFFFFF;
  --line: #D4DAE5;
  --back: #1A2E59;
  --back-2: #243F78;
  --back-ink: #F4F6FB;
  --challenge: #D9531F;
  --hot: #CC2E66;
  --edu: #0B8175;
  --btn: #14203B;
  --btn-ink: #FFFFFF;
  --shadow: 0 1px 2px rgba(20,32,59,.10), 0 12px 28px rgba(20,32,59,.16);
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1322; --ink: #E7ECF5; --muted: #98A4BC; --paper: #172139; --line: #27324C;
    --back: #20376A; --back-2: #2C4A8A; --back-ink: #F4F6FB;
    --challenge: #FF7A4A; --hot: #FF5E95; --edu: #2EC3B2;
    --btn: #E7ECF5; --btn-ink: #0B1322;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1322; --ink: #E7ECF5; --muted: #98A4BC; --paper: #172139; --line: #27324C;
  --back: #20376A; --back-2: #2C4A8A; --back-ink: #F4F6FB;
  --challenge: #FF7A4A; --hot: #FF5E95; --edu: #2EC3B2;
  --btn: #E7ECF5; --btn-ink: #0B1322;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}
html, body { height: 100%; }
* { box-sizing: border-box; }
body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  overflow: hidden;
}
.app {
  box-sizing: border-box;
  height: 100%;
  max-width: 460px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.event {
  font-family: var(--display);
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.01em;
  line-height: 1.15;
}
.event small {
  display: block;
  font-family: var(--body);
  font-weight: 500;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 3px;
}
.count {
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.count b { color: var(--ink); font-weight: 700; }

.table {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
}
.deck {
  position: relative;
  height: min(100%, 520px);
  aspect-ratio: 5 / 7;
  max-width: calc(100% - 14px);
}
.card, .under {
  position: absolute;
  inset: 0;
  border-radius: 18px;
}
.under {
  background: var(--back);
  box-shadow: var(--shadow);
}
.under.u1 { transform: translate(6px, 7px) rotate(2.2deg); background: var(--back-2); }
.under.u2 { transform: translate(-5px, 5px) rotate(-2.6deg); }
.card {
  perspective: 1400px;
  transition: transform .45s cubic-bezier(.5,0,.75,0), opacity .45s;
}
.card.gone { transform: translate(-130%, -6%) rotate(-16deg); opacity: 0; }
.inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform .7s cubic-bezier(.2,.8,.2,1);
}
.card.flipped .inner { transform: rotateY(180deg); }
.face {
  position: absolute;
  inset: 0;
  border-radius: 18px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* Card back */
.back {
  background:
    repeating-linear-gradient(45deg, transparent 0 14px, rgba(255,255,255,.045) 14px 15px),
    repeating-linear-gradient(-45deg, transparent 0 14px, rgba(255,255,255,.045) 14px 15px),
    var(--back);
  color: var(--back-ink);
  display: grid;
  place-items: center;
}
.back::before {
  content: "";
  position: absolute;
  inset: 12px;
  border: 1.5px solid rgba(255,255,255,.28);
  border-radius: 11px;
}
.back-mark { text-align: center; position: relative; }
.back-35 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(96px, 34cqw, 150px);
  line-height: .85;
  letter-spacing: -0.05em;
  color: transparent;
  -webkit-text-stroke: 2px var(--back-ink);
}
.deck { container-type: inline-size; }
.back-label {
  margin-top: 14px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: .8;
}
.back-cats {
  display: flex; gap: 7px; justify-content: center; margin-top: 16px;
}
.back-cats i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.back-cats i:nth-child(1) { background: var(--challenge); }
.back-cats i:nth-child(2) { background: var(--hot); }
.back-cats i:nth-child(3) { background: var(--edu); }

/* Card front */
.front {
  transform: rotateY(180deg);
  background: var(--paper);
  display: flex;
  flex-direction: column;
  --cat: var(--challenge);
}
.front.hot { --cat: var(--hot); }
.front.edu { --cat: var(--edu); }
.band {
  background: var(--cat);
  color: #FFFFFF;
  padding: 16px 20px 14px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
}
.kind {
  font-family: var(--display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.01em;
}
.num {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  font-variant-numeric: tabular-nums;
  opacity: .9;
}
.prompt {
  flex: 1;
  min-height: 0;
  padding: 22px 22px 10px;
  display: flex;
  align-items: center;
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(21px, 7.4cqw, 28px);
  line-height: 1.22;
  letter-spacing: -0.012em;
  text-wrap: pretty;
  overflow-wrap: anywhere;
}
.prompt.long { font-size: clamp(18px, 6.2cqw, 24px); }
.hint {
  padding: 0 22px 18px;
  font-size: 13px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.hint span:first-child { color: var(--cat); font-weight: 600; }

/* Buttons */
.controls { display: flex; gap: 10px; }
.shuffle {
  appearance: none;
  flex: 0 0 34%;
  min-height: 60px;
  border-radius: 8px;
  border: 2px solid var(--btn);
  background: transparent;
  color: var(--ink);
  font-family: var(--display);
  font-weight: 700;
  font-size: 18px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: transform .12s ease;
}
.shuffle:active { transform: scale(.97); }
.shuffle:focus-visible { outline: 3px solid var(--challenge); outline-offset: 3px; }
.deck.shuffling .under.u1 { animation: riffleR .55s ease-in-out 2; }
.deck.shuffling .under.u2 { animation: riffleL .55s ease-in-out 2; }
.deck.shuffling .card { animation: settle .55s ease-in-out 2; }
@keyframes riffleR { 50% { transform: translate(38%, 2%) rotate(9deg); } }
@keyframes riffleL { 50% { transform: translate(-38%, 3%) rotate(-10deg); } }
@keyframes settle { 50% { transform: translateY(-4%) scale(.97); } }

.flip {
  flex: 1;
  appearance: none;
  border: 0;
  width: 100%;
  min-height: 60px;
  border-radius: 8px;
  background: var(--btn);
  color: var(--btn-ink);
  font-family: var(--display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.01em;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: transform .12s ease;
}
.flip:active { transform: scale(.98); }
.flip:focus-visible { outline: 3px solid var(--challenge); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .inner, .card { transition: none; }
  .deck.shuffling .under, .deck.shuffling .card { animation: none; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="event">35th Anniversary Summit<small>Oct 2–3 · Challenge Deck</small></div>
    <div class="count" id="count" aria-live="polite"><b>200</b> cards left</div>
  </header>

  <main class="table">
    <div class="deck" id="deck">
      <div class="under u2"></div>
      <div class="under u1"></div>
    </div>
  </main>

  <div class="controls">
    <button class="shuffle" id="shuffle" type="button">Shuffle</button>
    <button class="flip" id="flip" type="button">Flip a card</button>
  </div>
</div>

const CATS = {
  challenge: { name: "Micro Challenge", hint: "Go do it" },
  hot:       { name: "Hot Take",        hint: "Answer fast" },
  edu:       { name: "Education",       hint: "Discuss" }
};

const CARDS = [
  ...CHALLENGES.map((t, i) => ({ id: "c" + i, cat: "challenge", n: i + 1, of: CHALLENGES.length, t })),
  ...HOT_TAKES.map((t, i)  => ({ id: "h" + i, cat: "hot",       n: i + 1, of: HOT_TAKES.length,  t })),
  ...EDUCATION.map((t, i)  => ({ id: "e" + i, cat: "edu",       n: i + 1, of: EDUCATION.length,  t }))
];

const KEY = "summit35-drawn";
let drawn = [];
try { drawn = JSON.parse(localStorage.getItem(KEY) || "[]").filter(id => CARDS.some(c => c.id === id)); } catch (e) { drawn = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(drawn)); } catch (e) {} };

const deck = document.getElementById("deck");
const btn = document.getElementById("flip");
const count = document.getElementById("count");
let current = null;
let busy = false;

function esc(s) { return s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]); }

function updateCount() {
  const left = CARDS.length - drawn.length;
  count.innerHTML = "<b>" + left + "</b> of " + CARDS.length + " left";
}

function makeCard(card) {
  const el = document.createElement("div");
  el.className = "card";
  const cat = CATS[card.cat];
  el.innerHTML =
    '<div class="inner">' +
      '<div class="face back"><div class="back-mark"><div class="back-35">35</div>' +
        '<div class="back-label">Summit Deck</div><div class="back-cats"><i></i><i></i><i></i></div></div></div>' +
      '<div class="face front ' + card.cat + '">' +
        '<div class="band"><span class="kind">' + cat.name + '</span><span class="num">' +
          String(card.n).padStart(3, "0") + ' / ' + card.of + '</span></div>' +
        '<div class="prompt' + (card.t.length > 110 ? " long" : "") + '">' + esc(card.t) + '</div>' +
        '<div class="hint"><span>' + cat.hint + '</span><span>35th Anniversary Summit</span></div>' +
      '</div>' +
    '</div>';
  return el;
}

function pick() {
  let pool = CARDS.filter(c => !drawn.includes(c.id));
  if (!pool.length) { drawn = []; pool = CARDS.slice(); }
  const card = pool[Math.floor(Math.random() * pool.length)];
  drawn.push(card.id);
  save();
  return card;
}

// Resting state: a face-down card on top of the pile.
let idle = makeCard(CARDS[0]);
idle.querySelector(".front").style.visibility = "hidden";
deck.appendChild(idle);
current = idle;
updateCount();

document.getElementById("shuffle").addEventListener("click", () => {
  if (busy) return;
  busy = true;
  drawn = [];
  save();
  const fresh = makeCard(CARDS[0]);
  fresh.querySelector(".front").style.visibility = "hidden";
  if (current) current.remove();
  deck.appendChild(fresh);
  current = fresh;
  idle = fresh;
  updateCount();
  btn.textContent = "Flip a card";
  deck.classList.remove("shuffling");
  void deck.offsetWidth;
  deck.classList.add("shuffling");
  const done = () => { deck.classList.remove("shuffling"); busy = false; };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) done(); else setTimeout(done, 1120);
});

btn.addEventListener("click", () => {
  if (busy) return;
  busy = true;
  const card = pick();
  const next = makeCard(card);
  const old = current;
  if (old) deck.insertBefore(next, old); else deck.appendChild(next);
  if (old && old !== idle) {
    old.classList.add("gone");
    setTimeout(() => old.remove(), 500);
  } else if (old) {
    old.remove();
  }
  current = next;
  requestAnimationFrame(() => requestAnimationFrame(() => next.classList.add("flipped")));
  updateCount();
  btn.textContent = "Flip another card";
  setTimeout(() => { busy = false; }, 450);
});
</script>
</body>
</html>
